    <text x="74" y="222" font-size="28" font-weight="600" fill="#F4F4F2" fill-opacity="0.72">Mobile screen pieces, measured from good apps</text>
    <text x="74" y="260" font-size="28" font-weight="600" fill="#F4F4F2" fill-opacity="0.72">structure only: no logo, text or brand colour.</text>
  </g>
  <g font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="18" fill="#F4F4F2" fill-opacity="0.5">
    <text x="74" y="312">$ python3 measurer/measure.py shot.png  &#8594;  measured.json</text>
  </g>
