<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="design-library: tested mobile screen pieces, measured from good apps and checked by a script">
  <rect width="1280" height="360" rx="28" fill="#26231C"/>
  <g font-family="ui-rounded, 'SF Pro Rounded', Nunito, 'Varela Round', system-ui, -apple-system, 'Segoe UI', sans-serif">
